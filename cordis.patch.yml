# Adds a host API and a per-conversation management view.  dshHomePath keeps
# the package portable across Windows, macOS, Linux and custom DSH_HOME roots.
- insert:
    - id: session-manage
      name: dsh-session-manage
      config:
        dshHome: !!js dshHomePath()
        trashDirectory: !!js dshHomePath('trash', 'session-manager')

    - id: ui-session-manage
      name: dsh-session-manage/client
